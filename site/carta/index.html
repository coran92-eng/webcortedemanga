<script>
(function(){
  var L=['ca','es','en'], p=null;
  try{ p=localStorage.getItem('cdm-lang'); }catch(e){}
  if(L.indexOf(p)<0){
    var n=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
    p='en';
    for(var i=0;i<n.length;i++){
      var c=String(n[i]||'').toLowerCase().slice(0,2);
      if(c==='ca'){p='ca';break}
      if(c==='es'||c==='gl'||c==='eu'){p='es';break}
      if(c==='en'){p='en';break}
    }
  }
  location.replace('/carta/'+p+'/'+location.search+location.hash);
})();
</script>

a{display:inline-block;margin:6px;padding:14px 20px;background:#1E3A2B;color:#F3ECDF;text-decoration:none;letter-spacing:.08em}
